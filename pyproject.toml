[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peewee-access"
version = "0.1.0"
description = "Microsoft Access (JET/ACE) backend for the peewee ORM"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Jeff Walsh"}]
keywords = ["peewee", "access", "accdb", "mdb", "jet", "ace", "odbc", "orm"]

# Windows only. The backend talks to the Microsoft Access ODBC driver
# through pyodbc, and reads the schema metadata that driver refuses to
# report through the ADOX COM interface supplied by pywin32. Neither
# component exists off Windows, so pywin32 is an unconditional dependency
# rather than a platform-gated one: an install elsewhere should fail at
# install time rather than succeed and then fail on import.
dependencies = [
    "peewee>=3.14",
    "pyodbc>=4.0",
    "pywin32>=300",
]

# Optional feature extras. Flask is needed only for AccessPaginatedQuery;
# pwaccess.paginate() covers the same ground with no web framework.
# Pydantic is needed only for playhouse.pydantic_utils.to_pydantic().
#
# The lists are spelled out rather than written as peewee-access[flask,
# pydantic], because self-referential extras need a recent pip and this
# package is routinely installed into older environments.
[project.optional-dependencies]
flask = ["flask>=2.0"]
pydantic = ["pydantic>=2.0"]
test = [
    "pytest>=7.0",
    "flask>=2.0",
    "pydantic>=2.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/zorderelda/peewee-access"
Issues = "https://github.com/zorderelda/peewee-access/issues"

[project.scripts]
# Equivalent to "python -m pwaccess". Generates peewee models from an
# existing .accdb / .mdb file:
#   pwaccess-pwiz -e access C:/data/app.accdb > models.py
pwaccess-pwiz = "pwaccess.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I"]