name: CI

# peewee-access is a Windows-only package at runtime, but most of it can be
# tested anywhere, and the split matters for both speed and cost.
#
# Around 170 tests exercise SQL generation, the LIMIT-to-TOP rewrite, the
# multi-row INSERT split, migrations, reflection metadata and URL parsing
# without opening a file or loading a driver. Every module guards its pyodbc
# import, so the package imports and those tests run with no driver present
# at all -- which makes Linux the right place for the bulk of the matrix.
#
# What Linux cannot prove is that a real install works: pywin32 has no
# non-Windows distribution, so `pip install .` deliberately fails there. Two
# Windows jobs cover that, at both ends of the supported range. They also
# pick up the ~70 tests marked `driver` / `adox` if the runner happens to
# have the Access Database Engine, which GitHub's images do not reliably
# ship -- treat those as a bonus, not a guarantee. The "Report resolved
# environment" steps make it visible either way.
#
# Billing note: on a private repository Windows minutes bill at 2x the Linux
# rate, so only the jobs that genuinely need Windows run there. On a public
# repository all of this is free and unlimited.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC. Catches a new peewee/pyodbc/pywin32 release
    # breaking unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main gate: every supported interpreter, driver-free, on Linux.
  test:
    name: linux py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # --no-deps skips pyodbc and pywin32, which have no Linux
      # distribution. The package still installs, entry point and all; the
      # driver-free tests do not need either module to be importable, and
      # tests/test_packaging.py asserts that stays true.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install peewee pytest flask pydantic

      - name: Test
        run: pytest -v

  # A real Windows install, with genuine pyodbc and pywin32, at both ends of
  # the supported range: the locked 3.9 floor and the newest interpreter
  # resolving everything fresh.
  windows:
    name: windows py${{ matrix.python-version }} (${{ matrix.mode }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            mode: locked
          - python-version: '3.14'
            mode: newest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (locked to constraints-py39.txt)
        if: matrix.mode == 'locked'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c constraints-py39.txt

      - name: Install (newest of everything, no constraints)
        if: matrix.mode == 'newest'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Report resolved environment
        # Never fails the job. Records what pip chose and whether the live
        # half of the suite had anything to run against, so a green build
        # with 70 skips is not mistaken for 70 passes.
        run: |
          pip list
          python -c "import pwaccess, pyodbc; print('pwaccess', pwaccess.__version__); print('Access drivers:', pwaccess.iter_access_drivers() or 'NONE -- live tests will skip'); print('All ODBC drivers:', pyodbc.drivers())"

      - name: Test
        run: pytest -v

  # The only job anywhere that exercises a real Access database.
  #
  # Everything else is driver-free by necessity: the Linux matrix cannot
  # load an ODBC driver at all, and GitHub's Windows image ships no Access
  # components -- no ACE, no ODBC driver, no OLE DB provider -- so the
  # `windows` jobs above skip the ~80 live tests. That left the driver
  # exercised only on a maintainer's machine, and a release validated by
  # `pytest --require-driver` being remembered.
  #
  # This job installs the Access Database Engine 2016 redistributable and
  # runs the suite with --require-driver, so a skip is a failure: if the
  # install silently half-works, this goes red rather than quietly
  # covering nothing.
  #
  # Deliberately NOT a required status check. It downloads 80MB from
  # download.microsoft.com, and those URLs rot -- the 2010 redistributable
  # link already 404s. A required check that depends on a third-party
  # download blocks every merge the day Microsoft moves the file. Treat a
  # red here as "investigate", not "the branch is broken".
  live-driver:
    name: windows live driver
    runs-on: windows-latest
    # Not needed for a documentation-only change, and it is the slowest
    # job in the workflow.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # /quiet is enough on a runner image, which has no click-to-run
      # Office for the installer to object to. The exit code is checked
      # explicitly because the installer is happy to fail quietly.
      - name: Install the Access Database Engine 2016 redistributable
        shell: pwsh
        run: |
          $url = 'https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe'
          Invoke-WebRequest -Uri $url -OutFile ace.exe -MaximumRedirection 5
          $p = Start-Process .\ace.exe -ArgumentList '/quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "ACE installer exited with $($p.ExitCode)"
            exit 1
          }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # Fails the job if the ODBC driver or the OLE DB provider is absent,
      # so a broken install is diagnosed here rather than surfacing as a
      # wall of confusing test errors further down.
      - name: Verify the driver and the OLE DB provider registered
        shell: pwsh
        run: |
          python -c "import pwaccess, pyodbc; d = pwaccess.iter_access_drivers(); print('Access drivers:', list(d)); print('All ODBC drivers:', pyodbc.drivers()); assert pwaccess.detect_driver(), 'no Access ODBC driver after install'"
          python -c "import win32com.client, tempfile, os; p = os.path.join(tempfile.mkdtemp(), 'probe.accdb'); c = win32com.client.Dispatch('ADOX.Catalog'); c.Create('Provider=Microsoft.ACE.OLEDB.12.0;Data Source=%s;' % p); assert os.path.isfile(p), 'ADOX did not create a file'; print('ADOX OK')"

      # --require-driver turns a skipped live test into an error. Without
      # it this job could install nothing, skip all ~80 live tests and
      # still report green, which is the exact failure it exists to
      # prevent.
      - name: Test, requiring the driver
        run: pytest -v --require-driver

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      # docs/conf.py mocks pyodbc, win32com and pythoncom for autodoc, so
      # the documentation builds without a driver.
      - name: Install
        run: |
          pip install -e . --no-deps
          pip install peewee sphinx

      # -W turns warnings into errors: a broken cross-reference or a stale
      # autodoc target should fail the build, not scroll past in the log.
      # Note this makes the job dependent on intersphinx reaching
      # docs.python.org and docs.peewee-orm.com.
      - name: Build the documentation
        run: sphinx-build -b html -W docs docs/_build/html

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .
