name: CI

# peewee-access is a Windows-only package at runtime, but most of it can be
# tested anywhere, and the split matters for both speed and cost.
#
# Around 170 tests exercise SQL generation, the LIMIT-to-TOP rewrite, the
# multi-row INSERT split, migrations, reflection metadata and URL parsing
# without opening a file or loading a driver. Every module guards its pyodbc
# import, so the package imports and those tests run with no driver present
# at all -- which makes Linux the right place for the bulk of the matrix.
#
# What Linux cannot prove is that a real install works: pywin32 has no
# non-Windows distribution, so `pip install .` deliberately fails there. Two
# Windows jobs cover that, at both ends of the supported range. They also
# pick up the ~70 tests marked `driver` / `adox` if the runner happens to
# have the Access Database Engine, which GitHub's images do not reliably
# ship -- treat those as a bonus, not a guarantee. The "Report resolved
# environment" steps make it visible either way.
#
# Billing note: on a private repository Windows minutes bill at 2x the Linux
# rate, so only the jobs that genuinely need Windows run there. On a public
# repository all of this is free and unlimited.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC. Catches a new peewee/pyodbc/pywin32 release
    # breaking unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The main gate: every supported interpreter, driver-free, on Linux.
  test:
    name: linux py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # --no-deps skips pyodbc and pywin32, which have no Linux
      # distribution. The package still installs, entry point and all; the
      # driver-free tests do not need either module to be importable, and
      # tests/test_packaging.py asserts that stays true.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install peewee pytest flask pydantic

      - name: Test
        run: pytest -v

  # A real Windows install, with genuine pyodbc and pywin32, at both ends of
  # the supported range: the locked 3.9 floor and the newest interpreter
  # resolving everything fresh.
  windows:
    name: windows py${{ matrix.python-version }} (${{ matrix.mode }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.9'
            mode: locked
          - python-version: '3.14'
            mode: newest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (locked to constraints-py39.txt)
        if: matrix.mode == 'locked'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c constraints-py39.txt

      - name: Install (newest of everything, no constraints)
        if: matrix.mode == 'newest'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Report resolved environment
        # Never fails the job. Records what pip chose and whether the live
        # half of the suite had anything to run against, so a green build
        # with 70 skips is not mistaken for 70 passes.
        run: |
          pip list
          python -c "import pwaccess, pyodbc; print('pwaccess', pwaccess.__version__); print('Access drivers:', pwaccess.iter_access_drivers() or 'NONE -- live tests will skip'); print('All ODBC drivers:', pyodbc.drivers())"

      - name: Test
        run: pytest -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip

      # docs/conf.py mocks pyodbc, win32com and pythoncom for autodoc, so
      # the documentation builds without a driver.
      - name: Install
        run: |
          pip install -e . --no-deps
          pip install peewee sphinx

      # -W turns warnings into errors: a broken cross-reference or a stale
      # autodoc target should fail the build, not scroll past in the log.
      # Note this makes the job dependent on intersphinx reaching
      # docs.python.org and docs.peewee-orm.com.
      - name: Build the documentation
        run: sphinx-build -b html -W docs docs/_build/html

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .
