name: CI

# Windows-only by design. peewee-access is a Windows-only package: it
# depends on pywin32 unconditionally and talks to the Microsoft Access ODBC
# driver, neither of which exists elsewhere, so `pip install .` cannot even
# resolve on a Linux runner.
#
# The suite splits in two. Around 170 tests exercise SQL generation, the
# LIMIT-to-TOP rewrite, the INSERT split, migrations, reflection metadata
# and URL parsing without ever opening a file; they run everywhere and are
# the gate. The remaining ~70 are marked `driver` or `adox` and skip
# automatically unless a real Access ODBC driver is installed. GitHub's
# windows runners do not reliably ship the Access Database Engine, so
# treat those as a bonus when they run rather than a guarantee. The
# "Report resolved environment" step below makes it visible either way.
#
# The matrix spans both ends deliberately: 3.9 is the floor a locked-down
# environment sits on, 3.14 is the newest release, and the `latest` job
# below re-resolves everything from PyPI on a schedule so an upstream
# release that breaks the backend surfaces here rather than in a user's
# install.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC. Catches new peewee/pyodbc/pywin32 releases
    # against unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Report resolved environment
        # Never fails the job. Records what pip actually chose, and whether
        # the live half of the suite had anything to run against -- so a
        # green build with 70 skips is not mistaken for 70 passes.
        run: |
          pip list
          python -c "import pwaccess, pyodbc; print('pwaccess', pwaccess.__version__); print('Access drivers:', pwaccess.iter_access_drivers() or 'NONE -- live tests will skip'); print('All ODBC drivers:', pyodbc.drivers())"

      - name: Test
        run: pytest -v

  # The constrained environment, installed exactly as it is at work: the
  # 3.9 lockfile rather than a fresh resolution. Proves the pinned set is
  # self-consistent and still passes, which a floating 3.9 job would not.
  locked:
    name: py3.9 (locked)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install against constraints-py39.txt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" -c constraints-py39.txt

      - name: Report resolved environment
        run: pip list

      - name: Test
        run: pytest -v

  # Newest interpreter, newest everything, no cache and no constraints.
  # This is the job that fails first when an upstream release breaks us.
  latest:
    name: py3.14 (unpinned, fresh resolve)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install newest of everything
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Report resolved environment
        run: pip list

      - name: Test
        run: pytest -v

  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: pip install -e ".[doc]"

      # -W turns warnings into errors: a broken cross-reference or a stale
      # autodoc target should fail the build, not scroll past in the log.
      - name: Build the documentation
        run: sphinx-build -b html -W docs docs/_build/html

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      # Only ruff is needed, so the Windows-only runtime dependencies are
      # deliberately not installed here.
      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .
