version: 2

# Pinning every action to a commit SHA closes a supply-chain hole -- a tag
# like @v4 is a moving branch, and a compromised action runs inside the job
# that holds the PyPI OIDC token. The cost of pinning is that the pins go
# stale silently, including security fixes. Dependabot is what pays that
# cost: it opens a PR when a pinned action moves, rewriting both the SHA
# and the trailing version comment.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR for all of them rather than five separate ones. A solo
    # maintainer reviews this in a single sitting, and CI proves the set
    # works together before it merges.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels: ['dependencies']

  # There is deliberately no `pip` entry.
  #
  # One used to be here, with a comment asserting that it would not touch
  # constraints-py39.txt. That was an assumption, not a rule, and it was
  # wrong: dependabot picked the lockfile up as a manifest and proposed
  # pytest 9.1.1, Sphinx 8.1.3 and alabaster 1.0.0 into it -- all of which
  # require Python 3.10 or newer, in a file whose entire purpose is to pin
  # one verified resolution for 3.9. CI caught it (`windows py3.9
  # (locked)` failed) and the PR was closed, but it would have returned
  # every month.
  #
  # It cannot be scoped away. dependabot.yml has no exclude-paths option,
  # and `ignore` matches dependency names rather than manifest files, so
  # there is no way to watch pyproject.toml while leaving the lockfile
  # alone. Ignoring by name instead would mean maintaining a list of every
  # package that has dropped 3.9 -- pytest and Sphinx today, alabaster and
  # imagesize already, whatever follows -- and each omission produces a
  # broken PR.
  #
  # Little is lost. pyproject declares floors (`peewee>=3.14`), which are
  # minimums rather than pins: raising them automatically gains nothing and
  # narrows what users can install. The lockfile is regenerated on purpose
  # with the command at the top of the file, because its value is
  # reflecting a single coherent resolution rather than drifting a package
  # at a time.
  #
  # Dependabot *security* alerts are unaffected. They do not come from this
  # file, so a vulnerability in peewee, pyodbc or pywin32 is still
  # reported.
